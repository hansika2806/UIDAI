[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E402", "E501", "F401", "F841", "E712", "E741"]

[tool.ruff.lint.per-file-ignores]
"**/*app.py" = ["E402"]
"**/tests/*" = ["F401", "E501"]
"**/*model_registry.py" = ["F841"]
"**/*drift_monitor.py" = ["F841"]
"**/*data_validator.py" = ["F401"]



