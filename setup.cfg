[flake8]
max-line-length = 120
extend-ignore =
    # E402: module level import not at top — required by Streamlit's sys.path pattern
    E402,
    # E203: whitespace before ':' — conflicts with Black formatting
    E203,
    # W503: line break before binary operator — conflicts with Black
    W503,
    # E501: line too long — Plotly/HTML strings are often unavoidably long
    E501
per-file-ignores =
    # Dashboard files require sys.path manipulation before imports
    dashboard/app.py: E402
    # Test files: allow longer assertion messages and unused imports
    tests/*: F401, E501
    # Utility/scaffolding files not part of core pipeline
    src/model_registry.py: F841
    src/drift_monitor.py: F841
    src/data_validator.py: F401
